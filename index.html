<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPin v4 Base</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{
  margin:0;
  height:100%;
}

#map{
  height:100vh;
}

/* 버튼 */
.btn{
 position:absolute;
 right:15px;

 width:55px;
 height:55px;

 border-radius:50%;
 border:none;

 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;

 font-size:18px;
 font-weight:bold;

 z-index:1000;

 background:#fff;

 /* 🔥 떠있는 느낌 */
 box-shadow:0 6px 15px rgba(0,0,0,0.3);

 /* 🔥 부드러운 애니메이션 */
 transition:all 0.15s ease;
}
/* 메뉴 버튼 (주황색) */
#menu-btn{
 background:#ff9800 !important;
  color:white !important;
}

/* GPS 버튼 (검은 회색) */
#gps-btn{
  background:#333 !important;
  color:white !important;
}

/* 일출 버튼 (검은 회색) */
#sun-btn{
  background:#333 !important;
  color:white !important;
}
 #menu-btn{bottom:20px;}
#gps-btn{bottom:85px;}
#sun-btn{bottom:150px;}

#panel{
 position:fixed;
 top:0;
 right:0;

 width:70%;
 max-width:320px;

 height:100vh;

 background:#fff;

 transform:translateX(110%);
 transition:.3s ease;

 z-index:9999;

 padding:8px;

 overflow-y:auto;
 overflow-x:hidden;

 box-sizing:border-box;

 pointer-events:none;
}

  #panel.show{
 transform:translateX(0);
 pointer-events:auto;
}

/* 💻 PC */
@media (min-width:768px){

 #panel{
   width:320px;
   height:100%;
 }

}


#panel.show{transform:translateX(0);}

/* 탭 */
#tabs{display:flex;gap:5px;margin-bottom:10px;}
#tabs button{flex:1;padding:8px;border:none;background:#ddd;}
#tabs .active{background:#333;color:#fff;}

/* 카드 */
.card{
 background:#eee;
 padding:8px;
 margin-bottom:6px;
 border-radius:6px;
}
.card img{
 width:100%;
 max-height:70px;
 object-fit:cover;
 margin-top:5px;
 border-radius:5px;
}

#menu-btn{ bottom:20px; }
#gps-btn{ bottom:90px; }
#sun-btn{ bottom:160px; }


/* 🔥 여기부터 추가 (맨 아래) */

/* 3️⃣ 아이콘 + 텍스트 */
.btn span{
 font-size:10px;
 margin-top:2px;
}

/* 4️⃣ 클릭 애니메이션 */
.btn:active{
 transform:scale(0.9);
 box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

/* 5️⃣ 색상 */
#menu-btn{
  background:#ff9800 !important;
  color:white !important;
}

#gps-btn{
  background:#333 !important;
  color:white !important;
}

#sun-btn{
  background:#333 !important;
  color:white !important;
}

/* 6️⃣ 위치 간격 */
#menu-btn{ bottom:20px; }
#gps-btn{ bottom:100px; }
#sun-btn{ bottom:180px; }

/* ➕ 등록 버튼 */
#add-btn{
 bottom:250px;
 background:#2196f3 !important;
 color:white !important;
}

#menu-btn{ bottom:20px; }
#gps-btn{ bottom:100px; }
#sun-btn{ bottom:180px; }

/* ➕ 등록 버튼 */
#add-btn{
 bottom:250px;
 background:#2196f3 !important;
 color:white !important;
}

/* 📱 모바일 리스트 여백 */
#list{
 padding-bottom:150px;
}

  #panel input,
#panel button{

 width:100%;

 padding:8px;

 margin-bottom:6px;

 font-size:16px;

 box-sizing:border-box;

}

@media (min-width:768px){

  #add-btn{
    display:none;
  }

}

</style>
</head>

<body>

<div id="map"></div>
<button id="menu-btn" class="btn">☰<span>☰</span></button>
<button id="gps-btn" class="btn">📍<span>내위치</span></button>
<button id="sun-btn" class="btn">🌅<span>일출</span></button>
<button id="add-btn" class="btn">➕<span>등록</span></button>
  <div id="panel">
  <button id="closeBtn">닫기</button>

  <div id="tabs">
    <button id="tab-poi" class="active">추천명소</button>
    <button id="tab-my">내 촬영지</button>
  </div>

  <input id="search" placeholder="검색">

 <form id="form" autocomplete="off">
    <input id="name" placeholder="이름">
    <input type="file" id="photo">
    <button>추가</button>
   <input id="memo" placeholder="메모"> 
  </form>

  <div id="list"></div>
</div>
<input
 type="file"
 id="mobile-photo"
 accept="image/*"
 capture="environment"
 style="display:none;"
>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="your.js"></script>
<script>
console.log("✔ HTML loaded");
</script>
</body>
</html>
