<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPin v4 Base</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{margin:0;height:100%;}
#map{height:100%;}

/* 버튼 */
.btn{
 position:absolute;
 right:15px;

 width:65px;
 height:65px;

 border-radius:50%;
 border:none;

 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;

 font-size:18px;
 font-weight:bold;

 z-index:1000;

 background:#fff;

 /* 🔥 떠있는 느낌 */
 box-shadow:0 6px 15px rgba(0,0,0,0.3);

 /* 🔥 부드러운 애니메이션 */
 transition:all 0.15s ease;
}
/* 메뉴 버튼 (주황색) */
#menu-btn{
 background:#ff9800 !important;
  color:white !important;
}

/* GPS 버튼 (검은 회색) */
#gps-btn{
  background:#333 !important;
  color:white !important;
}

/* 일출 버튼 (검은 회색) */
#sun-btn{
  background:#333 !important;
  color:white !important;
}
 #menu-btn{bottom:20px;}
#gps-btn{bottom:90px;}
#sun-btn{bottom:160px;}

/* 패널 */
#panel{
 position:absolute;
 top:0;right:0;
 width:320px;height:100%;
 background:#fff;
 transform:translateX(100%);
 transition:.3s;
 z-index:999;
 padding:10px;
 overflow:auto;
}
#panel.show{transform:translateX(0);}

/* 탭 */
#tabs{display:flex;gap:5px;margin-bottom:10px;}
#tabs button{flex:1;padding:8px;border:none;background:#ddd;}
#tabs .active{background:#333;color:#fff;}

/* 카드 */
.card{
 background:#eee;
 padding:8px;
 margin-bottom:6px;
 border-radius:6px;
}
.card img{
 width:100%;
 max-height:100px;
 object-fit:cover;
 margin-top:5px;
 border-radius:5px;
}

#menu-btn{ bottom:20px; }
#gps-btn{ bottom:90px; }
#sun-btn{ bottom:160px; }


/* 🔥 여기부터 추가 (맨 아래) */

/* 3️⃣ 아이콘 + 텍스트 */
.btn span{
 font-size:10px;
 margin-top:2px;
}

/* 4️⃣ 클릭 애니메이션 */
.btn:active{
 transform:scale(0.9);
 box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

/* 5️⃣ 색상 */
#menu-btn{
  background:#ff9800 !important;
  color:white !important;
}

#gps-btn{
  background:#333 !important;
  color:white !important;
}

#sun-btn{
  background:#333 !important;
  color:white !important;
}

/* 6️⃣ 위치 간격 */
#menu-btn{ bottom:20px; }
#gps-btn{ bottom:100px; }
#sun-btn{ bottom:180px; }

</style>
</head>

<body>

<div id="map"></div>
<button id="menu-btn" class="btn">☰<span>☰</span></button>
<button id="gps-btn" class="btn">📍<span>내위치</span></button>
<button id="sun-btn" class="btn">🌅<span>일출</span></button>
<div id="panel">
  <button id="closeBtn">닫기</button>

  <div id="tabs">
    <button id="tab-poi" class="active">추천명소</button>
    <button id="tab-my">내 촬영지</button>
  </div>

  <input id="search" placeholder="검색">

  <form id="form">
    <input id="name" placeholder="이름">
    <input type="file" id="photo">
    <button>추가</button>
   <input id="memo" placeholder="메모"> 
  </form>

  <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>

 const map = L.map("map", {
  doubleClickZoom: false
}).setView([37.56,126.97],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png")
.addTo(map);

 map.on("dblclick", ()=>{
  panel.classList.remove("show");
});
 
/* 상태 */
let current="poi";
let marker = null;
let sunLine = null;  // 일출선 토글용 

 /* 추천명소 20개 */
const defaultPlaces = [
 {name:"남산타워",lat:37.5512,lng:126.9882},
 {name:"한강공원",lat:37.52,lng:126.98},
 {name:"북한산",lat:37.658,lng:126.977},
 {name:"경복궁",lat:37.5796,lng:126.977},
 {name:"창덕궁",lat:37.5794,lng:126.991},
 {name:"롯데월드타워",lat:37.513,lng:127.102},
 {name:"인왕산",lat:37.602,lng:126.962},
 {name:"올림픽공원",lat:37.52,lng:127.121},
 {name:"청계천",lat:37.57,lng:126.99},
 {name:"남한산성",lat:37.47,lng:127.18},
 {name:"해운대",lat:35.1587,lng:129.1604},
 {name:"광안리",lat:35.153,lng:129.118},
 {name:"설악산",lat:38.119,lng:128.465},
 {name:"속초해변",lat:38.207,lng:128.591},
 {name:"강릉 경포대",lat:37.8,lng:128.896},
 {name:"제주 성산일출봉",lat:33.458,lng:126.94},
 {name:"협재해변",lat:33.393,lng:126.24},
 {name:"부산 태종대",lat:35.05,lng:129.086},
 {name:"여수 돌산공원",lat:34.73,lng:127.74},
 {name:"순천만",lat:34.9,lng:127.5}
];

/* 저장 데이터 */
let myPlaces = JSON.parse(localStorage.getItem("myPlaces")||"[]");

/* DOM 연결 */
const panel = document.getElementById("panel");
const list = document.getElementById("list");

const menuBtn = document.getElementById("menu-btn");
const closeBtn = document.getElementById("closeBtn");
const gpsBtn = document.getElementById("gps-btn");
const sunBtn = document.getElementById("sun-btn");

const tabPoi = document.getElementById("tab-poi");
const tabMy = document.getElementById("tab-my");

const form = document.getElementById("form");
const search = document.getElementById("search");

/* 메뉴 */
menuBtn.onclick=()=>{
  panel.classList.add("show");
  render();
};

menuBtn.ondblclick=()=>{
  panel.classList.remove("show");
}; 
 
closeBtn.onclick=()=>{
  panel.classList.remove("show");
};

tabPoi.onclick=()=>{
  current="poi";
  tabPoi.classList.add("active");
  tabMy.classList.remove("active");
  render();
};

tabMy.onclick=()=>{
  current="my";
  tabMy.classList.add("active");
  tabPoi.classList.remove("active");
  render();
};

gpsBtn.onclick=()=>{
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;

    map.setView([lat,lng],15);

    // 🔥 기존 마커 제거
    if(marker){
      map.removeLayer(marker);
    }

    // 🔥 marker 변수 재사용
    marker = L.marker([lat,lng])
      .addTo(map)
      .bindPopup("내 위치")
      .openPopup();
  });
};

sunBtn.onclick=()=>{

  if(sunLine){
    map.removeLayer(sunLine);
    sunLine = null;
    return;
  }

  const center = map.getCenter();

  const lat=center.lat;
  const lng=center.lng;

  const eastLng = lng + 0.2;

  sunLine = L.polyline([[lat,lng],[lat,eastLng]],{
    color:"orange"
  }).addTo(map);
};

/* 이미지 압축 */
function resizeImage(file){
 return new Promise(res=>{
  const img=new Image();
  const reader=new FileReader();

  reader.onload=e=>img.src=e.target.result;

  img.onload=()=>{
    const canvas=document.createElement("canvas");
    const max=300;

    let w=img.width;
    let h=img.height;

    if(w>max){
      h*=max/w;
      w=max;
    }

    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);

    res(canvas.toDataURL("image/jpeg",0.6));
  };

  reader.readAsDataURL(file);
 });
}

/* 렌더 */
function render(){
 list.innerHTML="";

 const keyword = search.value.toLowerCase();

 if(current==="poi"){
  defaultPlaces
   .filter(p=>p.name.toLowerCase().includes(keyword))
   .forEach(p=>createCard(p,false));
 }else{
  myPlaces
   .filter(p=>p.name.toLowerCase().includes(keyword))
   .forEach((p,i)=>createCard(p,true,i));
 }
}

/* 카드 */
function createCard(p,isMy,i){
 const div = document.createElement("div");
 div.className = "card";

 div.innerHTML = "<b>"+p.name+"</b>";

 // 📸 사진
 if(p.photo){
  const img = document.createElement("img");
  img.src = p.photo;

  img.onclick = (e)=>{
    e.stopPropagation();
    showImage(p.photo);
  };

  div.appendChild(img);
 }

 // 📝 메모
 if(p.memo){
  const m = document.createElement("div");
  m.textContent = "📝 " + p.memo;
  m.style.fontSize = "12px";
  m.style.color = "#555";
  m.style.marginTop = "4px";
  div.appendChild(m);
 }

 // 📍 클릭 이벤트
 div.onclick = ()=>{
  map.setView([p.lat,p.lng],15);

  if(marker){
    map.removeLayer(marker);
  }

  marker = L.marker([p.lat,p.lng]).addTo(map);

  marker.bindPopup(p.name);

  marker.on("click", ()=>{
    let html = "<b>"+p.name+"</b>";

    if(p.photo){
      html += `<br><img src="${p.photo}" style="width:100%;max-height:120px;border-radius:6px;margin-top:5px;">`;
    }

    if(p.memo){
      html += `<br><div style="font-size:12px;margin-top:4px;">📝 ${p.memo}</div>`;
    }

    marker.setPopupContent(html);
  });
 };

 // 🗑 삭제 버튼
 if(isMy){
  const del = document.createElement("button");
  del.textContent = "삭제";

  del.onclick = (e)=>{
    e.stopPropagation();

    myPlaces.splice(i,1);
    localStorage.setItem("myPlaces",JSON.stringify(myPlaces));

    render();
  };

  div.appendChild(del);
 }

 list.appendChild(div);
}

/* 저장 */
form.onsubmit=async(e)=>{
 e.preventDefault();

 if(current!=="my"){
  alert("내 촬영지 탭에서 추가하세요");
  return;
 }

 const name=document.getElementById("name").value;
 const file=document.getElementById("photo").files[0];
 const memo = document.getElementById("memo").value;  // ✅ 여기 추가

 if(!name){
  alert("이름 입력하세요");
  return;
}
 let img="";

 if(file){
  img = await resizeImage(file);
 }

 const c = map.getCenter();

 myPlaces.push({
  name:name,
  lat:c.lat,
  lng:c.lng,
  photo:img
  memo:memo   // 🔥 반드시 추가
 });

 localStorage.setItem("myPlaces",JSON.stringify(myPlaces));

 form.reset();
 render();
};


/* 검색 */
search.oninput=render;

/* 최초 */
render();

</script>

</body>
</html>
