<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SkyPin v2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body,html{margin:0;height:100%;}
#map{height:100%;}

/* 메뉴 버튼 */
#menu-btn{
 position:absolute;
 bottom:20px;
 right:20px;
 width:50px;height:50px;
 border-radius:50%;
 background:#fff;
 border:1px solid #ccc;
 z-index:1000;
}

/* 패널 */
#side-panel{
 position:absolute;
 top:0;right:0;
 width:320px;height:100%;
 background:#fff;
 transform:translateX(100%);
 transition:.3s;
 z-index:999;
 padding:10px;
 overflow:auto;
}
#side-panel.show{transform:translateX(0);}

/* 탭 */
#tabs{
 display:flex;
 gap:5px;
 margin-bottom:10px;
}
#tabs button{
 flex:1;
 padding:8px;
 border:none;
 background:#ddd;
 cursor:pointer;
}
#tabs button.active{
 background:#333;
 color:#fff;
}

/* 카드 */
.place-card{
 display:flex;
 justify-content:space-between;
 padding:8px;
 margin-bottom:5px;
 background:#eee;
 border-radius:5px;
 cursor:pointer;
}

.delete-btn{
 background:red;
 color:#fff;
 border:none;
}
</style>
</head>

<body>

<div id="map"></div>
<button id="menu-btn">☰</button>

<div id="side-panel">
  <button id="close-panel">닫기</button>

  <div id="tabs">
    <button id="tab-poi" class="active">추천명소</button>
    <button id="tab-my">내 촬영지</button>
  </div>

  <form id="form">
    <input id="name" placeholder="이름 입력">
    <button type="submit">추가</button>
  </form>

  <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* 지도 */
const map = L.map("map").setView([37.56,126.97],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png")
.addTo(map);

/* 상태 */
let current = "poi";

/* 데이터 */
const defaultPlaces = [
 {name:"남산타워",lat:37.5512,lng:126.9882},
 {name:"해운대",lat:35.1587,lng:129.1604}
];

let myPlaces = JSON.parse(localStorage.getItem("myPlaces")||"[]");

/* DOM */
const panel = document.getElementById("side-panel");
const list = document.getElementById("list");

/* 메뉴 */
menuBtn.onclick = ()=>{
 panel.classList.add("show");
 render();
};

closeBtn.onclick = ()=>{
 panel.classList.remove("show");
};

/* 탭 */
tabPoi.onclick = ()=>{
 current="poi";
 setActive(tabPoi);
 render();
};

tabMy.onclick = ()=>{
 current="my";
 setActive(tabMy);
 render();
};

function setActive(btn){
 document.querySelectorAll("#tabs button")
 .forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
}

/* 렌더 */
function render(){
 list.innerHTML="";

 if(current==="poi"){
  defaultPlaces.forEach(p=>createCard(p,false));
 }else{
  myPlaces.forEach((p,i)=>createCard(p,true,i));
 }
}

/* 카드 */
function createCard(p,isMy,index){

 const div=document.createElement("div");
 div.className="place-card";

 div.innerHTML=`<span>${p.name}</span>`;

 div.onclick=()=>{
  map.setView([p.lat,p.lng],15);
  L.marker([p.lat,p.lng]).addTo(map)
  .bindPopup(p.name).openPopup();
 };

 if(isMy){
  const del=document.createElement("button");
  del.textContent="삭제";
  del.className="delete-btn";

  del.onclick=(e)=>{
   e.stopPropagation();
   myPlaces.splice(index,1);
   localStorage.setItem("myPlaces",JSON.stringify(myPlaces));
   render();
  };

  div.appendChild(del);
 }

 list.appendChild(div);
}

/* 추가 */
form.onsubmit=(e)=>{
 e.preventDefault();

 if(current!=="my"){
  alert("내 촬영지 탭에서만 추가 가능");
  return;
 }

 const name=document.getElementById("name").value;
 if(!name) return;

 const center=map.getCenter();

 myPlaces.push({
  name:name,
  lat:center.lat,
  lng:center.lng
 });

 localStorage.setItem("myPlaces",JSON.stringify(myPlaces));

 form.reset();
 render();
};

/* 최초 실행 */
render();

</script>

</body>
</html>
