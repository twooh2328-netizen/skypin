<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SkyPin v3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body,html{margin:0;height:100%;}
#map{height:100%;}

/* 버튼 */
#menu-btn,#gps-btn,#sun-btn{
 position:absolute;
 right:20px;
 width:50px;height:50px;
 border-radius:50%;
 background:#fff;
 border:1px solid #ccc;
 z-index:1000;
}
#menu-btn{bottom:20px;}
#gps-btn{bottom:80px;}
#sun-btn{bottom:140px;}

/* 패널 */
#side-panel{
 position:absolute;
 top:0;right:0;
 width:320px;height:100%;
 background:#fff;
 transform:translateX(100%);
 transition:.3s;
 z-index:999;
 padding:10px;
 overflow:auto;
}
#side-panel.show{transform:translateX(0);}

/* 탭 */
#tabs{display:flex;gap:5px;margin-bottom:10px;}
#tabs button{flex:1;padding:8px;border:none;background:#ddd;}
#tabs .active{background:#333;color:#fff;}

/* 카드 */
.place-card{
 background:#eee;
 padding:8px;
 margin-bottom:6px;
 border-radius:5px;
 cursor:pointer;
}
.place-card img{
 width:100%;
 max-height:100px;
 object-fit:cover;
 border-radius:5px;
 margin-top:5px;
}
.delete-btn{background:red;color:#fff;border:none;}
</style>
</head>

<body>

<div id="map"></div>

<button id="menu-btn">☰</button>
<button id="gps-btn">📍</button>
<button id="sun-btn">🌅</button>

<div id="side-panel">
  <button id="close-panel">닫기</button>

  <div id="tabs">
    <button id="tab-poi" class="active">추천명소</button>
    <button id="tab-my">내 촬영지</button>
  </div>

  <input id="search" placeholder="검색...">

  <form id="form">
    <input id="name" placeholder="이름">
    <input type="file" id="photo">
    <button>추가</button>
  </form>

  <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* 지도 */
const map = L.map("map").setView([37.56,126.97],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

/* 상태 */
let current="poi";
let myPos=null;
let selectedPos=null; // 사용자가 클릭한 좌표

/* 데이터 */
const defaultPlaces=[
 {name:"남산타워",lat:37.5512,lng:126.9882},
 {name:"해운대",lat:35.1587,lng:129.1604}
];

let myPlaces=JSON.parse(localStorage.getItem("myPlaces")||"[]");

/* DOM */
const panel=document.getElementById("side-panel");
const list=document.getElementById("list");
const search=document.getElementById("search");

const menuBtn = document.getElementById("menu-btn");
const closeBtn = document.getElementById("close-panel");
const gpsBtn = document.getElementById("gps-btn");
const sunBtn = document.getElementById("sun-btn");

const tabPoi = document.getElementById("tab-poi");
const tabMy = document.getElementById("tab-my");
const form = document.getElementById("form");

/* 버튼 */
menuBtn.onclick=()=>{panel.classList.add("show");render();}
closeBtn.onclick=()=>panel.classList.remove("show");

tabPoi.onclick=()=>{current="poi";setActive(tabPoi);render();}
tabMy.onclick=()=>{current="my";setActive(tabMy);render();}

function setActive(btn){
 document.querySelectorAll("#tabs button")
 .forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
}

/* GPS 마커 관리 */
let gpsMarker = null;

gpsBtn.onclick=()=>{
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;
  map.setView([lat,lng],15);

  // 기존 GPS 마커 제거
  if(gpsMarker){
    map.removeLayer(gpsMarker);
  }

  // 새 GPS 마커 추가
  gpsMarker = L.marker([lat,lng]).addTo(map).bindPopup("내 위치").openPopup();
  myPos={lat,lng};
 });
};

/* 🌅 일출 방향 (간단 계산) */
sunBtn.onclick=()=>{
 if(!myPos) return alert("먼저 GPS 클릭");

 const lat=myPos.lat;
 const lng=myPos.lng;
 const newLng=lng+0.2;

 L.polyline([[lat,lng],[lat,newLng]],{color:"orange"}).addTo(map);
};

/* 마커 관리 */
let markers = [];
function clearMarkers(){
 markers.forEach(m => map.removeLayer(m));
 markers = [];
}

/* 지도 클릭 시 위치 선택 */
map.on("click", e=>{
 selectedPos = e.latlng;
});

/* 렌더 */
function render(){
 list.innerHTML="";
 const keyword=search.value.toLowerCase();

 if(current==="poi"){
  defaultPlaces
  .filter(p=>p.name.toLowerCase().includes(keyword))
  .forEach(p=>createCard(p,false));
 }else{
  myPlaces
  .filter(p=>p.name.toLowerCase().includes(keyword))
  .forEach((p,i)=>createCard(p,true,i));
 }
}

/* 카드 */
function createCard(p,isMy,i){
 const div=document.createElement("div");
 div.className="place-card";
 div.innerHTML=`<b>${p.name}</b>`;

 if(p.photo){
  const img=document.createElement("img");
  img.src=p.photo;
  div.appendChild(img);
 }

 div.onclick=()=>{
  clearMarkers();
  const marker = L.marker([p.lat,p.lng]).addTo(map)
    .bindPopup(p.name).openPopup();
  markers.push(marker);
  map.setView([p.lat,p.lng],15);
 };

 if(isMy){
  const del=document.createElement("button");
  del.textContent="삭제";
  del.className="delete-btn";
  del.onclick=(e)=>{
   e.stopPropagation();
   myPlaces.splice(i,1);
   localStorage.setItem("myPlaces",JSON.stringify(myPlaces));
   clearMarkers(); // 삭제 시 마커도 제거
   render();
  };
  div.appendChild(del);
 }

 list.appendChild(div);
}

/* 추가 */
form.onsubmit=async(e)=>{
 e.preventDefault();
 if(current!=="my"){ alert("내 촬영지에서만 추가"); return; }

 const name=document.getElementById("name").value;
 const file=document.getElementById("photo").files[0];
 let img="";

 if(file){
  const reader=new FileReader();
  img = await new Promise(res=>{
    reader.onload=e=>res(e.target.result);
    reader.readAsDataURL(file);
  });
 }

 const pos = selectedPos || myPos || map.getCenter();

 myPlaces.push({
  name:name,
  lat:pos.lat,
  lng:pos.lng,
  photo:img
 });

 localStorage.setItem("myPlaces",JSON.stringify(myPlaces));
 form.reset();
 render();
};

/* 검색 */
search.oninput=render;

/* 최초 */
render();

</script>

</body>
</html>
